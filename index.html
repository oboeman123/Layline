function netWatch(c){const pc=c.peerConnection;if(!pc||pc.__nw||typeof pc.addEventListener!='function')return;pc.__nw=1;let t=0;
  const st=()=>pc.connectionState||pc.iceConnectionState;
  const dead=()=>{if(NET.conn!==c)return;try{c.close();}catch(e){}if(NET.conn===c&&NET.status!='lost'&&NET.status!='gone')netLost(c);};
  const chk=()=>{clearTimeout(t);const s=st();if(s=='failed'||s=='closed')return dead();
    if(s=='disconnected'||pc.iceConnectionState=='disconnected')t=setTimeout(()=>{if(st()!='connected'||pc.iceConnectionState=='disconnected')dead();},6000);};
  pc.addEventListener('connectionstatechange',chk);pc.addEventListener('iceconnectionstatechange',chk);chk();}
function netLinked(){NET.linked=true;NET.lostAt=0;clearInterval(NET.retry);NET.retry=null;
  const v=NET.conn&&NET.conn.relay?'relay':'direct';if(NET.via!==v){NET.via=v;if(UI.screen=='game')renderTable();}netSave();}
function netTake(c){const old=NET.conn;NET.conn=c;NET.linked=false;c.__cand=false;if(old&&old!==c){old.__old=true;setTimeout(()=>{if(NET.conn!==old)try{old.close();}catch(e){}},3000);}}
function netOnData(c,m){
  if(!m||typeof m!='object')return;
  if(c!==NET.conn){if(m.t=='hello'&&c.__cand&&!c.__old&&c.open&&NET.role=='host')netTake(c);else return;}
  switch(m.t){
    case 'hello':{
      if(m.v!==netVersion()){c.send({t:'refuse',why:'version'});netStatus('error',NET_OLD);return netRefused(c);}
      if(c.__acc){if(!m.got&&c.__hello)c.__hello();return;}   // said again: they did not get our hello yet
      NET.oppName=cleanName(m.name)||'Opponent';if(NET.match)NET.match.opp=NET.oppName;
      const M=NET.match;
      if(m.resume&&M&&m.resume.mid===M.mid){                  // reconnect, in this game or a later one: resend what they missed
        const same=!!NET.game&&m.resume.gid===NET.game.gid;
        NET.outbox.filter(x=>x.t!='act'||!same||x.n>m.resume.recv).forEach(x=>c.send(x));netClockTo(c);
        const was=NET.status;c.__acc=true;netLinked();netStatus('connected');netBar();if(was=='lost'||was=='gone')toast('Reconnected to '+esc(NET.oppName)+'.');netTick();return;}
      // our opponent is back without this match (it missed the start on another line, or its page reloaded): everything again
      if(NET.role=='host'&&M&&M.winner==null&&NET.oppPeer&&netWho(c)===NET.oppPeer){NET.outbox.forEach(x=>c.send(x));netClockTo(c);
        const was=NET.status;c.__acc=true;netLinked();netStatus('connected');netBar();if(was=='lost'||was=='gone')toast('Reconnected to '+esc(NET.oppName)+'.');netTick();return;}
      // a match is set up or running: nobody new may take the seat
      if(NET.role=='host'&&(M&&M.winner==null||NET.game&&UI.G&&UI.G.online&&UI.G.winner==null)){c.send({t:'busy'});return;}
      c.__acc=true;netLinked();
      if(NET.role=='host'){
        if(M)return netStatus('connected');                     // the match is over: they are back for the rematch
        if(!netDeckOK(m.deck)){c.send({t:'refuse',why:'deck'});return netStatus('error','Your opponent’s deck is not legal in this version.');}
        NET.oppDeck=m.deck;NET.oppPeer=netWho(c);netStatus('connected');netNewMatch();
      } else if(!M)netStatus('connected','Connected to '+NET.oppName+' · '+(m.fmt=='bo3'?'Best of 3':'Single game')+'. Waiting for the host to start…');
      else netStatus('connected');
      return;}
    case 'start':return netOnStart(m);
    case 'toss':return netOnToss(m);
    case 'pick':return netOnPick(m);
    case 'gend':return netOnGend(m);
    case 'clock':return netOnClock(m);
    case 'act':return netOnAct(m);
    case 'mull':return netOnMull(m);
    case 'concede':return netOnConcede(m);
    case 'rematch':{const M=NET.match;if(!M||M.winner==null||(m.mid&&m.mid!==M.mid))return;NET.rematch[1]=true;
      if(NET.role=='host'&&NET.rematch[0])return netNewMatch(true);

    case 'desync':if(UI.G&&UI.G.online&&(UI.G.winner==null||NET.match&&NET.match.winner==null&&NET.match.phase!='stopped'))netDesync(String(m.why||'The games no longer match.').slice(0,200));return;
    case 'refuse':netStatus('error',m.why=='version'?NET_OLD:'The host could not accept your deck.');return netRefused(c);
    case 'busy':netStatus('error','That game already has two players.');return netRefused(c);
    case 'bye':NET.bye=true;return;
  }
}
// refused (busy, other version, deck): a guest in the lobby stops trying, so the message stays (Join tries again)
function netRefused(c){if(NET.role!='guest'||netInMatch())return;NET.refused=true;netGuestStop();setTimeout(()=>{try{c.close();}catch(e){}},500);}
// the host's choice clock after a reconnect: the time left, so the guest does not show its own stale count
function netClockTo(c){const M=NET.match;if(NET.role=='host'&&M&&M.winner==null&&(M.phase=='toss'||M.phase=='between')&&M.dealt!==M.g)
  try{c.send({t:'clock',mid:M.mid,g:M.g,left:Math.max(0,Math.round(M.pickLeft))});}catch(e){}}
function netOnClock(m){const M=NET.match;
  if(NET.role!='guest'||!M||m.mid!==M.mid||m.g!==M.g||M.winner!=null||M.dealt===M.g||!(M.phase=='toss'||M.phase=='between')||typeof m.left!='number')return;
  M.pickLeft=Math.max(0,Math.min(NET_PICK_MS,m.left));M.pickRun=0;netTick();}
// the opponent conceded the game, or the match ('match' also counts between games)
function netOnConcede(m){
  const M=NET.match,G=UI.G;if(!M||(m.mid&&m.mid!==M.mid)||M.phase=='stopped')return;   // stopped out of sync: nothing counts
  const live=G&&G.online&&G.mid===M.mid;
  if(NET.role=='guest'&&m.scope=='match'){
    // the host conceded the match or left: its own record already says so, and its 'gend' (if it comes) agrees.
    // If we conceded at the same moment, the host counted its own concession first: the game on our board is ours.
    if(M.winner!=null)return;M.conceded=1;
    if(live&&G.gid===m.gid&&!G.recorded&&(G.winner==null||G.how=='concede')){G.winner=0;G.reason=nOpp()+(M.need>1?' conceded the match.':' conceded.');G.how='concede';renderTable();}
    if(live&&G.winner!=null&&G.winner>=0&&!G.recorded)netRecord(G);
    if(M.winner==null){M.winner=0;M.phase='over';}
    netPickStop();matchFinish(M);return netShowEnd();}
  const scope=m.scope=='match'&&M.need>1?'match':'game';
  if(G&&G.online&&G.mid===M.mid&&G.gid===m.gid&&G.winner==null){
    if(scope=='match'&&NET.role=='host'&&M.winner==null)M.conceded=1;
    G.winner=0;G.reason=nOpp()+(scope=='match'?' conceded the match.':' conceded.');G.how='concede';renderTable();return gameOver();}
  if(scope=='match'&&NET.role=='host'&&M.winner==null){            // between games: the match ends here
    M.conceded=1;
    if(G&&G.online&&G.mid===M.mid&&G.winner!=null&&!G.recorded)netRecord(G);
    if(M.winner==null){M.winner=0;M.phase='over';}

}
function netLost(c){
  if(c!==NET.conn||NET.status=='idle')return;
  NET.linked=false;

    if(netInMatch()){const who=NET.oppName||'Your opponent';netStatus('gone',who+' left the game.');
      const r=document.querySelector('.overlay.end [data-act=nrematch]');if(r){r.disabled=true;r.textContent=who+' left';}toast(esc(who)+' left the game.');netBar();return;}
    // still in the lobby: the host keeps its code open, the guest tries again while the join window lasts (not after
    // it was refused or gave up: that message stays)
    if(NET.role=='host'&&(NET.peer&&!NET.peer.destroyed||netRelayUp()))return netStatus('waiting','The connection closed. Waiting for your friend to join again…');
    if(NET.role=='guest'&&(NET.refused||NET.stopDial||NET.status=='error'))return;
    if(NET.role=='guest'&&Date.now()<NET.joinUntil){netStatus('loading','The connection closed. Trying again…');return netDial(true);}
    return netStatus('error','The connection closed.');}

  netBar();netRetry();

// while the line is down: the bar counts down 90 s, the guest dials again, the host waits
function netRetry(){
  if(NET.retry)return;let k=0;NET.retry=setInterval(()=>{

    if(Date.now()-NET.lostAt>90000){clearInterval(NET.retry);NET.retry=null;NET.status='gone';if(NET.role=='guest')netRelayStop();netBar();return;}

// back from another app, the lock screen or a network change: check the matchmaking connection and redial
function netWake(){

  if(!NET.role||NET.status=='idle')return;
  if(typeof rlyWake=='function')rlyWake();
  if(p&&p.destroyed){                                // never got onto the matchmaking server
    if(!netInMatch()){
      if(NET.role=='host'&&NET.status!='error'){clearTimeout(NET.rcT);netHostPeer(0);}
      else if(NET.role=='guest'&&Date.now()<NET.joinUntil){clearTimeout(NET.rcT);netGuestPeer();}}}
  else if(p){const ws=p.socket&&p.socket._socket;
    if(p.disconnected){clearTimeout(NET.rcT);NET.rcN=0;try{p.reconnect();}catch(e){}netSettle(p);}
    else if((p.open||p.__opened)&&(!ws||ws.readyState>1||(NET.role=='host'&&!netInMatch()&&away>5000))){
      // the phone may have dropped the socket while asleep, or the server our registration: register again
      // (same code and token, so the server accepts it at once)
      clearTimeout(NET.rcT);NET.rcN=0;try{p.disconnect();p.reconnect();}catch(e){}netSettle(p);}}
  if(NET.role=='guest'&&!netLive()&&(netInMatch()?NET.status=='lost':Date.now()<NET.joinUntil&&NET.status!='error'))netDial(true);
  if(NET.status=='lost')netBar();
}
document.addEventListener('visibilitychange',()=>{if(document.hidden){NET.hiddenAt=Date.now();if(NET.match)NET.match.pickRun=0;netKeepHost();netSave();}else netWake();});
addEventListener('pagehide',()=>netSave());
addEventListener('pageshow',e=>{if(e.persisted)netWake();});
addEventListener('online',()=>netWake());
// a slim status bar while something is wrong with the connection: over the board, or over the between-games screen
function netBar(){

  const where=G&&G.online&&UI.screen=='game'&&G.winner!==-1||M&&M.winner==null&&M.phase!='stopped'&&!!document.querySelector('.overlay.end');
  if(!NET.role||!where||NET.status=='connected'||NET.status=='idle'){if(b)b.remove();return;}
  if(NET.status!='lost'&&NET.status!='gone'){if(b)b.remove();return;}
  if(!b){b=document.createElement('div');b.className='netbar';document.body.appendChild(b);}
  const gone=NET.status=='gone',s=Math.max(0,90-Math.round((Date.now()-NET.lostAt)/1000));
  const claim=M&&M.winner==null&&M.phase!='stopped'&&(M.results.length||G&&G.online&&G.mid===M.mid)?`<button class="btn sm pri" data-act="nclaim">${M.need>1?'Claim the match':'Claim the win'}</button>`:'';
  const h=gone?`<span>${esc(NET.oppName||'Your opponent')} is gone.</span>${claim}<button class="btn sm" data-act="nleave">Leave</button>`
    :`<span class="spin sm"></span><span>Connection lost. Reconnecting… ${s}s</span>`;

}
// the opponent is gone: a result already on the board stands; whatever is left of the match is ours

  const live=G&&G.online&&G.mid===M.mid;
  if(live&&G.winner!=null&&G.winner>=0&&!G.recorded)netRecord(G);
  if(M.winner==null){M.conceded=1;M.claimed=true;
    if(live&&G.winner==null){G.winner=0;G.reason=nOpp()+' left the game.';G.how='disconnect';netRecord(G);renderTable();}
    else{M.winner=0;M.phase='over';}}
  netPickStop();if(NET.role=='host')netSendGend(G&&G.gid);else netGuestStop();matchFinish(M);netBar();netShowEnd();
}
// leaving concedes what is unfinished: the game in progress and, in best of 3, the match
function netLeaveSend(){
  const M=NET.match,G=UI.G;
  if(M&&M.winner==null&&M.phase!='stopped'&&(M.results.length||G&&G.online&&G.mid===M.mid)){
    netSend({t:'concede',mid:M.mid,gid:G&&G.gid,scope:'match'},true);

    if(G&&G.online&&G.mid===M.mid){if(G.winner==null){G.winner=1;G.reason='You left the game.';G.how='concede';}if(G.winner>=0&&!G.recorded)netRecord(G);}

/* ---------- game over: the host decides, the guest confirms; between games, the next choice ---------- */
const _netGameOver=gameOver;
gameOver=function(){
  const G=UI.G;if(!G||!G.online)return _netGameOver();
  if(G.winner==null||G.winner===-1)return;                    // -1: stopped out of sync, no result
  const M=NET.match;if(!M||G.mid!==M.mid)return;

};
function netShowEnd(){
  const M=NET.match,G=UI.G;if(!M)return;
  // the same screen is already up (a 'gend' that only confirms what is shown): leave it alone
  const key=[M.mid,M.g,M.phase,M.winner,M.results.length,M.score.join('-'),M.picked?1:0,G&&G.gid,G&&G.confirmed?1:0,NET.rematch[0]?1:0].join('|'),cur=document.querySelector('.overlay.end');

}
function netShowEnd2(M,G){

    endOverlay(`<div class="mend"><div class="bigres${b?' mbig':''}" style="color:${won?'#7fe0a0':'#ff4d5e'}">${b?(won?'GAME WON':'GAME LOST'):(won?'VICTORY':'DEFEAT')}</div>
      <p class="mwhy">${whyHTML(G.reason)}</p><p class="mwait mute"><span class="spin sm"></span> Confirming the result with ${esc(nOpp())}…</p></div>`);

  if(M.winner!=null){if(M.need>1)matchOver(M);else netBo1End();return netBar();}
  if(M.phase=='between'||M.phase=='toss'){if(M.dealt!==M.g)matchChoice(M);return netBar();}
}
// the end of a single online game: as vs the AI, with Rematch

// conceding online: the game on screen ends at once; the host decides the result
const _netConcede=concede;
concede=function(scope){

/* ---------- lobby ---------- */
function onlineScreen(){
  const q=netParams(),j=q.get('join');
  if(!NET.deckSel)try{NET.deckSel=localStorage.getItem('ll_netdeck')||'';}catch(e){}
  app.innerHTML=`<div class="scroll"><div class="wrapw"><div class="top"><button class="btn sm" data-act="nback">← Back</button><h2>Play online</h2></div><div id="olb"></div></div></div>`;
  if(j&&!NET.role&&!NET.autoJoined){NET.autoJoined=true;NET.joinCode=netCodeFrom(j)||'';NET.fromLink=!!NET.joinCode;}
  paintOnline();
}
const netCanShare=()=>!!(navigator.share&&COARSE);
function netLobby(){
  const decks=savedDecks().map((d,i)=>d.cards.length==DECK_SIZE?`<option value="s:${i}" ${NET.deckSel=='s:'+i?'selected':''}>${esc(d.name)}</option>`:'').join('');
  const quick=legendsList().map(c=>`<option value="l:${c.id}" ${NET.deckSel=='l:'+c.id?'selected':''}>${FACTIONS[c.f].icon} ${esc(c.name)} · best build</option>`).join('');
  const inClaude=netInClaude()&&!netParams().get('peerhost'),r=netRelaySaved()||{},d=NET.relayDraft||{};
  const v=k=>esc(d[k]!=null?d[k]:(r[k]||''));
  return `${inClaude?'<div class="olst error" style="margin:0 0 12px">Online play runs on your own hosted copy of Leyline (for example on GitHub Pages), not inside the Claude preview.</div>':''}<div class="olgrid">
    <section class="olp olyou"><h3>You</h3>
      <label class="ollab">Name shown to your opponent<input type="text" id="nname" maxlength="16" autocomplete="nickname" value="${esc(netName())}"></label>
      <label class="ollab">Deck<select id="ndeck">${decks?`<optgroup label="Your decks">${decks}</optgroup>`:''}<optgroup label="Quick decks">${quick}</optgroup></select></label></section>
    <section class="olp olhost"><h3>Host a game</h3><div class="olbody" id="olhost"></div></section>
    <section class="olp oljoin"><h3>Join a game</h3><p class="mute" id="oljoinp"></p>
      <div class="rw"><input type="text" id="ncode" maxlength="300" placeholder="6-letter code" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="go" aria-label="Game code" value="${esc(NET.role=='guest'?NET.code:(NET.joinCode||''))}">
      <button class="btn pri" data-act="njoin">Join</button></div><div class="olbody" id="oljoin"></div></section>
  </div>
  <details class="olhelp" ${NET.helpOpen?'open':''}><summary>Connection help</summary>
    <ul>
      <li>On iPhone, send the code with <b>Invite</b> and stay on this page until your friend joins. If you switch apps, come back to Leyline: the game waits for you.</li>
      <li>Leyline first connects your devices directly. If that does not work within a few seconds (some Wi-Fi, mobile data, school or office networks), it switches to the built-in <b>relay</b>: free public servers pass the moves along, encrypted with a key made from the game code. The game shows <b>Direct</b> or <b>Relay</b>.</li>
      <li>Both players need the same version: if in doubt, both refresh the page.</li></ul>
    <label class="olchk"><input type="checkbox" id="nrlyon" ${typeof rlyOff=='function'&&!rlyOff()?'checked':''}> Use the built-in relay servers when needed</label>
    <div class="olst" id="olrlyst"></div>
    <details class="oladv" ${NET.advOpen?'open':''}><summary>Advanced: your own servers</summary>
    <p class="mute">Your own relay server (MQTT over a secure WebSocket) is used besides the built-in ones. Both players need it. Saved on this device.</p>
    <label class="ollab">Relay server (MQTT)<input type="text" id="nbroker" placeholder="wss://broker.example.com/mqtt" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" value="${esc(NET.brokerDraft!=null?NET.brokerDraft:typeof rlyMine=='function'?rlyMine():'')}"></label>
    <p class="mute">Relay server for direct connections (TURN). One of you is enough. Free accounts: Metered (metered.ca) or Cloudflare. Paste the address, username and password they give you. They are saved on this device only.</p>
    <div class="olrelay">
      <label class="ollab">Server address<input type="text" id="nturn" placeholder="turn:server:port" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" value="${v('url')}"></label>
      <div class="olrelay2"><label class="ollab">Username<input type="text" id="nturnuser" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" value="${v('user')}"></label>
      <label class="ollab">Password<input type="password" id="nturnpass" autocomplete="off" value="${v('pass')}"></label></div>
      <div class="rw"><button class="btn sm pri" data-act="nrelaysave">Save</button><button class="btn sm" data-act="nrelaytest">Test</button><button class="btn sm" data-act="nrelayclear">Remove</button></div>
      <div class="olst" id="olrelayst"></div></div></details>
  </details>
  <p class="mute olnote">Your browsers connect directly to each other, or through the encrypted relay when they cannot. Both players need the same version of Leyline. Games use your own decks. Rewards are as vs the AI: a single game pays 2 packs for a win and 1 for a loss; a best of 3 pays 5 for a match win and, for a loss, 1 per game played to the end; a conceded game pays nothing.</p>`;
}
function netStatusHTML(){
  if(NET.status=='idle')return '';
  const spin=NET.status=='loading'||NET.status=='waiting'||(NET.status=='connected'&&!netInMatch()),via=NET.status=='connected'&&netVia();
  return `<div class="olst ${NET.status}">${spin?'<span class="spin sm"></span>':''}<span>${esc(NET.msg||{waiting:'Waiting for your friend to join…',connected:'Connected.',error:'Something went wrong.',loading:'Connecting…'}[NET.status]||'')}${via?` <small class="olvia">${via}</small>`:''}</span></div>`;
}
function netRelayLine(){
  if(typeof rlyOK!='function'||!rlyOK())return 'Relay: not available here (it needs an https:// page). Direct connections only.';
  const n=rlyEndpoints().length,who=(rlyOff()?'your own server':n+' server')+(n>1?'s':'');if(!n)return 'Relay: off. Direct connections only.';
  return 'Relay: on ('+who+')'+(RLY.on?' · '+rlyUp()+' of '+RLY.brk.length+' reachable now':'. Used when a direct connection does not work.');
}
function paintOnline(){
  const el=$('#olb');if(!el)return;
  if(!el.querySelector('.olgrid'))el.innerHTML=netLobby();
  const st=NET.status,host=NET.role=='host',guest=NET.role=='guest',busy=st=='loading'||st=='waiting'||st=='connected';
  const grid=el.querySelector('.olgrid');
  grid.classList.toggle('hosting',host&&busy);grid.classList.toggle('joining',guest&&busy);grid.classList.toggle('fromlink',!NET.role&&!!NET.fromLink);
  const cancel='<div class="rw"><button class="btn sm" data-act="ncancel">Cancel</button></div>';
  // host panel: the code, Invite (phones) or copy buttons, the status and Cancel
  let h='';
  if(host&&NET.code&&st!='error'&&st!='idle'){
    const link=netLink(),share=netCanShare();
    h=`<div class="olcode"><small>Game code · ${FMT[NET.fmt].n}</small><b>${NET.code}</b>
      ${share?`<button class="btn pri olinv" data-act="ninvite">Invite…</button>`:''}
      <div class="rw olcopy"><button class="btn sm" data-act="ncopy" data-v="${NET.code}">Copy code</button>${link?`<button class="btn sm" data-act="ncopy" data-v="${esc(link)}">Copy invite link</button>`:''}</div>
      <p class="olkeep">Keep Leyline open until your friend joins.</p></div>${netStatusHTML()}${cancel}`;
  } else h=`<p class="mute">Get a code and send it to a friend.</p><div class="rw olfmt">${Object.keys(FMT).map(k=>`<button class="chip ${NET.fmt==k?'on':''}" data-act="nfmt" data-v="${k}" ${busy?'disabled':''}>${FMT[k].n}</button>`).join('')}</div><button class="btn pri" data-act="nhost" ${busy?'disabled':''}>Create game</button>${host?netStatusHTML()+cancel:''}`;
  const hb=$('#olhost');if(hb&&hb._h!==h){hb._h=h;hb.innerHTML=h;}
  const j=guest?netStatusHTML()+cancel:'',jb=$('#oljoin');if(jb&&jb._h!==j){jb._h=j;jb.innerHTML=j;}
  const jp=$('#oljoinp');if(jp)jp.textContent=NET.fromLink&&!NET.role?'Your friend’s code is filled in. Pick your deck, then tap Join. The host picks single game or best of 3.':'Type or paste the code your friend sent you. The host picks single game or best of 3.';
  const jbtn=el.querySelector('[data-act=njoin]');if(jbtn)jbtn.disabled=busy;
  const ci=$('#ncode');if(ci){ci.disabled=guest&&busy;if(guest&&document.activeElement!==ci)ci.value=NET.code;}
  // a new error or status in the panel in use is scrolled into view (phones stack the panels)
  const key=NET.role+'|'+st;if(key!==NET.painted){NET.painted=key;const box=guest?jb:host?hb:null;
    if(box&&st!='idle'&&box.scrollIntoView)try{box.scrollIntoView({block:'nearest'});}catch(e){}}
  const rs=$('#olrelayst');if(rs){const rl=netRelays();rs.textContent=rl.length?'TURN server: on ('+[...new Set(rl.map(x=>x.src))].join(', ')+')':'TURN server: none.';}
  const ry=$('#olrlyst');if(ry){const t=netRelayLine();if(ry.textContent!==t)ry.textContent=t;}
}
// the relay settings changed: a game code that is open (host) or being joined (guest) uses the new servers at once;
// during a match the change waits for the next one (returns false then)
function netRelayApplyNow(){
  if(netInMatch())return false;
  if(NET.role=='host')netRelayListen();
  else if(NET.role=='guest')netRelayStop();
  if(typeof rlyRestart=='function')rlyRestart();
  if(NET.role=='guest'&&NET.status=='loading')netRelayDial();
  return true;
}
function netRelayForm(){const g=id=>(($(id)||{}).value||'').trim();return {url:g('#nturn'),user:g('#nturnuser'),pass:g('#nturnpass')};}
// accept a pasted snippet from the provider's dashboard: the turn: addresses plus username and credential
function netRelayParse(f){
  const t=f.url;let user=f.user,pass=f.pass;
  const mu=t.match(/username["']?\s*[:=]\s*["']([^"']+)["']/i),mp=t.match(/credential["']?\s*[:=]\s*["']([^"']+)["']/i);
  if(mu&&!user)user=mu[1];if(mp&&!pass)pass=mp[1];
  const urls=/[{[]|username|credential/i.test(t)?(t.match(/turns?:[A-Za-z0-9.\-\[\]:]+(\?transport=(udp|tcp))?/gi)||[]):netIceUrls(t);
  return {url:netIceUrls(urls).filter(u=>/^turns?:/i.test(u)).join(' '),user,pass};
}
function netRelayApply(){if(NET.peer&&NET.peer.options)NET.peer.options.config=netIce();paintOnline();}
// ask the relay for an address: that proves the address, username and password work
function netRelayTest(){
  const f=netRelayParse(netRelayForm()),e=netIceEntry(f.url,f.user,f.pass),out=$('#olrelayst');
  const say=(t,cls)=>{if(out){out.className='olst '+(cls||'');out.textContent=t;}};
  if(!e)return say(f.url&&(!f.user||!f.pass)?'Enter the username and password too.':'Enter a server address that starts with turn: or turns:.','error');
  if(!window.RTCPeerConnection)return say('This browser cannot make direct connections.','error');
  say('Testing the relay server…');
  let pc;try{pc=new RTCPeerConnection({iceServers:[e],iceTransportPolicy:'relay'});}catch(err){return say('That server address is not valid.','error');}
  let done=false;const fin=(ok)=>{if(done)return;done=true;try{pc.close();}catch(x){}
    say(ok?'The relay server works.':'No answer from the relay server. Check the address, username and password.',ok?'connected':'error');};
  pc.onicecandidate=ev=>{if(ev.candidate&&/ typ relay /.test(ev.candidate.candidate))fin(true);else if(!ev.candidate)fin(false);};
  pc.createDataChannel('t');pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>fin(false));
  setTimeout(()=>fin(false),9000);
}
document.addEventListener('change',e=>{
  if(e.target.id=='ndeck'){NET.deckSel=e.target.value;try{localStorage.setItem('ll_netdeck',NET.deckSel);}catch(x){}}
  if(e.target.id=='nname'){const n=cleanName(e.target.value);e.target.value=n;try{localStorage.setItem('ll_name',n);}catch(x){}}
  if(e.target.id=='nrlyon'){try{e.target.checked?localStorage.removeItem('ll_norelay'):localStorage.setItem('ll_norelay','1');}catch(x){}
    const now=netRelayApplyNow();
    toast((e.target.checked?'Relay on.':rlyEndpoints().length?'Built-in relay off. Your own relay server is still used.':'Relay off: direct connections only.')+(now?'':' This applies from your next game.'));paintOnline();}
  if(e.target.id=='nbroker'){const v=e.target.value.trim(),ok=rlyParse(v);NET.brokerDraft=null;
    if(v&&!ok.length){toast('Enter an address that starts with wss://');return;}
    try{v?localStorage.setItem('ll_broker',ok.map(x=>x.user!=null?x.url.replace('://','://'+encodeURIComponent(x.user)+':'+encodeURIComponent(x.pass)+'@'):x.url).join(' ')):localStorage.removeItem('ll_broker');}catch(x){}
    const now=netRelayApplyNow();toast((v?'Relay server saved.':'Relay server removed.')+(now?'':' This applies from your next game.'));paintOnline();}
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id=='ncode'){const v=e.target.value,c=netCodeFrom(v);if(c&&v!==c&&(v.length>6||/[^A-Za-z0-9]/.test(v)))e.target.value=c;NET.joinCode=e.target.value;NET.fromLink=false;}
  if(id=='nturn'||id=='nturnuser'||id=='nturnpass')NET.relayDraft=netRelayForm();
  if(id=='nbroker')NET.brokerDraft=e.target.value;
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='ncode'){e.preventDefault();const b=$('[data-act=njoin]');if(b&&!b.disabled)b.click();}});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('olhelp'))NET.helpOpen=e.target.open;if(e.target.classList&&e.target.classList.contains('oladv'))NET.advOpen=e.target.open;},true);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  switch(b.dataset.act){
    case 'nhost':NET.deckSel=($('#ndeck')||{}).value||NET.deckSel;return netHost();
    case 'njoin':NET.deckSel=($('#ndeck')||{}).value||NET.deckSel;return netJoin(($('#ncode')||{}).value);
    case 'ncancel':netReset();return paintOnline();
    case 'nback':netReset();return go('menu');
    case 'ncopy':{const v=b.dataset.v;try{navigator.clipboard.writeText(v).then(()=>toast('Copied.'),()=>toast(esc(v)));}catch(x){toast(esc(v));}return;}
    case 'ninvite':{const link=netLink(),data={title:'Leyline',text:'Play Leyline with me. Game code: '+NET.code};if(link)data.url=link;
      try{navigator.share(data).catch(err=>{if(err&&err.name!='AbortError')toast('Could not open the share sheet. Use Copy code instead.');});}catch(x){toast('Could not open the share sheet. Use Copy code instead.');}return;}
    case 'nrelaysave':{const f=netRelayParse(netRelayForm());
      if(!netIceEntry(f.url,f.user,f.pass)){toast(f.url&&(!f.user||!f.pass)?'Enter the username and password too.':NET_DEAD.test(netRelayForm().url)?'That relay server no longer works.':'Enter a server address that starts with turn: or turns:.');return;}
      try{localStorage.setItem('ll_relay',JSON.stringify(f));}catch(x){}NET.relayDraft=null;
      ['#nturn','#nturnuser','#nturnpass'].forEach((id,i)=>{const el=$(id);if(el)el.value=[f.url,f.user,f.pass][i];});
      toast('Relay server saved.');return netRelayApply();}
    case 'nrelayclear':try{localStorage.removeItem('ll_relay');}catch(x){}NET.relayDraft=null;['#nturn','#nturnuser','#nturnpass'].forEach(id=>{const el=$(id);if(el)el.value='';});
      toast('Relay server removed.');return netRelayApply();
    case 'nrelaytest':return netRelayTest();
    case 'nfmt':if(NET.role)return;NET.fmt=b.dataset.v=='bo3'?'bo3':'bo1';try{localStorage.setItem('ll_netfmt',NET.fmt);}catch(x){}return paintOnline();
    case 'nrematch':{const M=NET.match;if(!M||M.winner==null||NET.rematch[0])return;if(NET.status=='gone')return toast(esc(nOpp())+' left the game.');NET.rematch[0]=true;netSend({t:'rematch',mid:M.mid},true);
      if(NET.role=='host'&&NET.rematch[1])return netNewMatch(true);
      b.disabled=true;b.textContent='Waiting for '+(NET.oppName||'your opponent')+'…';return;}
    case 'nclaim':return netClaim();
    case 'nleave':if(typeof leaveGuard=='function'&&leaveGuard('menu'))return;return netLeave();
  }
},true);
// leaving an online game or match in progress counts as conceding it
const _netGo=go;
go=function(s){
  const G=UI.G;
  if(G&&G.online&&UI.screen=='game'&&s!='game'&&NET.role){
    netLeaveSend();setTimeout(netReset,150);
    document.querySelectorAll('.netbar').forEach(b=>b.remove());
  } else if(UI.screen=='online'&&s!='online'&&NET.role){if(NET.match)netLeaveSend();netReset();}   // left the lobby (or the coin toss)
  return _netGo(s);
};
// a reloaded guest gets its match back (also on the invite link it joined with), an invite link opens the lobby,
// a reloaded host gets its game code back
// (a guest whose page reloaded in the lobby or during the coin toss joins the same code again; with both a host and a
// guest record, as two tabs of one browser leave, this tab's own role decides)
{const j=netParams().get('join'),gg=netSavedGuest('guest'),gh=netSavedGuest('host');let r='';try{r=sessionStorage.getItem('ll_role')||'';}catch(e){}
  const g=r=='host'?gh:r=='guest'?gg:gg&&gh?(gh.t>gg.t?gh:gg):gg||gh,h=!g&&!j&&r!='guest'&&netSavedHost();
  if(g&&(!j||netCodeFrom(j)===g.code))setTimeout(()=>{if(UI.screen=='menu'&&!NET.role&&!document.querySelector('.overlay')){
    if(g.lite){go('online');netJoin(g.code);}else if(g.role=='host')netResumeHost(g);else netResume(g);}},60);
  else if(j)setTimeout(()=>{if(UI.screen=='menu')go('online');},50);
  else if(h)setTimeout(()=>{if(UI.screen=='menu'&&!NET.role){go('online');netHost(h);}},60);}

</script>
